# Builds and tests every push and pull request. Deploys stay manual (see deploy/).
name: CI

on:
  push:
    branches: [master, main, 'merge/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Inventory.sln
      - run: dotnet build Inventory.sln -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Inventory.UnitTests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Integration tests (MySQL 8.4 in Docker via Testcontainers)
        run: dotnet test tests/Inventory.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  ui:
    name: ${{ matrix.app }} build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: inventory-ui
            args: --base-href /inventory/
          - app: landing-ui
            args: ''
    defaults:
      run:
        working-directory: client/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx ng build ${{ matrix.args }}
