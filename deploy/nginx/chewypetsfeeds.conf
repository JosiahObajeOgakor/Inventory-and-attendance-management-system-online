# /etc/nginx/sites-available/chewypetsfeeds.conf  (symlink into sites-enabled)
# Same Kestrel/systemd unit (inventory-api) as inventory.conf — this just adds a second domain in front of it.
# Replace chewypetsfeeds.com with the real domain. Certificates are added/renewed by certbot (`certbot --nginx`).
#
#   chewypetsfeeds.com            -> landing-ui  (client/landing-ui, built with `ng build`)
#   chewypetsfeeds.com/inventory  -> inventory-ui (client/inventory-ui, built with `ng build --base-href /inventory/`)
#   chewypetsfeeds.com/api/*      -> the same Kestrel process the inventory.<domain> vhost proxies to

server_tokens off;
limit_req_zone $binary_remote_addr zone=cpf_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name chewypetsfeeds.com www.chewypetsfeeds.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://chewypetsfeeds.com$request_uri; }
}

server {
    # "listen … http2" works on nginx 1.24 (Ubuntu 24.04); the newer "http2 on;" directive needs 1.25.1+.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chewypetsfeeds.com www.chewypetsfeeds.com;

    ssl_certificate     /etc/letsencrypt/live/chewypetsfeeds.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chewypetsfeeds.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-ancestors/img-src kept the same shape as inventory.conf; media-src added for the landing page's hero video.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API: /api/* only, proxied to the same loopback Kestrel listener the inventory domain uses.
    location /api/ {
        limit_req zone=cpf_api burst=40 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Inventory app under /inventory — build it with: ng build --base-href /inventory/
    # A regex location with alias must capture the file path, or every asset resolves to the folder itself.
    location ~* ^/inventory/(.+\.(?:js|css|woff2?|svg|png|jpg|jpeg|ico))$ {
        alias /var/www/inventory/$1;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /inventory/ {
        alias /var/www/inventory/;
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /inventory/index.html;
    }
    location = /inventory { return 301 /inventory/; }

    # Landing page at the root — hashed assets cache forever, index.html never.
    root /var/www/landing;
    index index.html;
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
