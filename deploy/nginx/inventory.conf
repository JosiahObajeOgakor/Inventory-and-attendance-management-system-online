# /etc/nginx/sites-available/inventory.conf  (symlink into sites-enabled)
# Replace inventory.example.com with the real domain. Certificates are added/renewed by certbot (`certbot --nginx`).

# Never leak the server version.
server_tokens off;

# Slow down abusive clients before they reach Kestrel (auth endpoints are also rate-limited inside the API).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name inventory.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inventory.example.com;

    # certbot fills these in:
    ssl_certificate     /etc/letsencrypt/live/inventory.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /var/www/inventory;
    index index.html;

    # The API: only /api/* is proxied, and only to the loopback Kestrel listener.
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Angular: hashed assets cache forever, index.html never.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;    # SPA routes
    }
}
